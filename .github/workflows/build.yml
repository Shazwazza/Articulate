name: Articulate Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-flight PR runs when a new push lands; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_FOLDER: build/Release
      # The actual test run is ~2s; 60s gives a 30x margin for testhost startup
      VSTEST_CONNECTION_TIMEOUT: 60
      DOTNET_SYSTEM_NET_DISABLEIPV6: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.*.lock.json"

      - uses: dotnet/nbgv@v0.5.2
        with:
          setAllVars: true

      - name: Log Build Context
        run: |
          echo "Articulate Build Context"
          echo "Version: ${NBGV_SemVer2}"
          echo "Commit: ${NBGV_GitCommitIdShort}"
          echo "Date: ${NBGV_GitCommitDate}"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: src/Articulate.Web/Client/package.json
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "src/Articulate.Web/Client/.node-version"
          cache: "pnpm"
          cache-dependency-path: "src/Articulate.Web/Client/pnpm-lock.yaml"

      - name: Reset act client dependencies
        if: ${{ env.ACT == 'true' }}
        shell: bash
        run: rm -rf src/Articulate.Web/Client/node_modules src/Articulate.Web/Client/v17/node_modules src/Articulate.Web/Client/v18/node_modules

      - name: Relink act client dependencies
        if: ${{ env.ACT == 'true' }}
        working-directory: src/Articulate.Web/Client
        run: pnpm install --frozen-lockfile --force

      - name: Guard backoffice lane boundary
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ROOT="src/Articulate.Web/Client"
          leaked="$(
            git ls-files \
              "${CLIENT_ROOT}/v17/src" \
              "${CLIENT_ROOT}/v18/src" 2>/dev/null \
              || true
          )"
          if [ -n "${leaked}" ]; then
            echo "::error::Per-lane source under ${CLIENT_ROOT}/{v17,v18}/src/:"
            echo "${leaked}"
            echo "Move it to ${CLIENT_ROOT}/common/src/."
            exit 1
          fi
          echo "Lane boundary clean."

      - name: Run lane builds
        shell: bash
        run: |
          set -euo pipefail

          # --clean wipes src/**/bin|obj, build/ClientAssets, and BackOffice
          # static web assets. Keep lanes sequential: v18 overwrites shared
          # output, including the v17 hashed JS asset (e.g. client.gen-XXXX.js).
          for lane in v17 v18; do
            echo "::group::Build ${lane}"
            dotnet run build/build.cs -- build --lane "${lane}" --sample --clean
            echo "::endgroup::"
          done

      - name: Smoke-test package contents
        # Smoke covers both v17 + v18
        shell: bash
        run: |
          set -euo pipefail
          # Verify each lane's .nupkg / .snupkg has the expected shape
          # (manifest, backoffice bundles, themes, embedded resources,
          # razor-compiled views, no lock files) before we publish them.
          node build/smoke-package.mjs \
            build/Release/v17 \
            build/Release/v18

      - name: Resolve generated package versions
        shell: bash
        run: |
          set -euo pipefail

          package_version() {
            local directory="$1"
            local package
            package="$(find "$directory" -maxdepth 1 -type f -name 'Articulate.[0-9]*.nupkg' -print -quit)"
            [[ -n "$package" ]] || { echo "No Articulate package found in $directory" >&2; exit 1; }
            basename "$package" | sed -e 's/^Articulate\.//' -e 's/\.nupkg$//'
          }

          V17_VERSION="$(package_version build/Release/v17)"
          V18_VERSION="$(package_version build/Release/v18)"
          echo "V17_VERSION=$V17_VERSION" >> "$GITHUB_ENV"
          echo "V18_VERSION=$V18_VERSION" >> "$GITHUB_ENV"
          echo "Generated v17 package: $V17_VERSION"
          echo "Generated v18 package: $V18_VERSION"

      - name: Upload v17 packages
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Articulate-${{ env.V17_VERSION }}
          # Articulate.Theme.Sample is built for the local Docker pipeline
          # (see docker/src/ArticulateDockerSite.csproj) but never
          # published, so don't upload it as a CI artifact.
          path: |
            ${{ env.RELEASE_FOLDER }}/v17/Articulate.[0-9]*.nupkg
            ${{ env.RELEASE_FOLDER }}/v17/Articulate.[0-9]*.snupkg

      - name: Upload v18 packages
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Articulate-${{ env.V18_VERSION }}
          path: |
            ${{ env.RELEASE_FOLDER }}/v18/Articulate.[0-9]*.nupkg
            ${{ env.RELEASE_FOLDER }}/v18/Articulate.[0-9]*.snupkg
