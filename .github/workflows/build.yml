name: Articulate Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_FOLDER: build/Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: dotnet/nbgv@v0.5.2
        with:
          setAllVars: true

      - name: Log Build Context
        run: |
          echo "Articulate Build Context"
          echo "Version: ${NBGV_SemVer2}"
          echo "Commit: ${NBGV_GitCommitIdShort}"
          echo "Date: ${NBGV_GitCommitDate}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          package_json_file: src/Articulate.Web/Client/package.json
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: "src/Articulate.Web/Client/.node-version"
          cache: "pnpm"
          cache-dependency-path: "src/Articulate.Web/Client/pnpm-lock.yaml"

      - name: Resolve pnpm store path
        id: pnpm-cache
        run: |
          echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('src/Articulate.Web/Client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Resolve package versions
        shell: bash
        run: |
          set -euo pipefail

          V17_VERSION="${NBGV_SemVer2}"
          case "$V17_VERSION" in
            6.1.*) ;;
            *)
              echo "Expected NBGV to produce a 6.1.x version, got '$V17_VERSION'." >&2
              exit 1
              ;;
          esac

          V18_VERSION="$(tr -d '[:space:]' < build/v18-version.txt)"
          case "$V18_VERSION" in
            7.*) ;;
            *)
              echo "Invalid v18 base version '$V18_VERSION' in build/v18-version.txt." >&2
              exit 1
              ;;
          esac

          V17_PATCH_AND_SUFFIX="${V17_VERSION#6.1.}"
          V17_SUFFIX=""
          if [[ "$V17_PATCH_AND_SUFFIX" == *-* ]]; then
            V17_SUFFIX="${V17_PATCH_AND_SUFFIX#*-}"
          fi

          if [[ -n "$V17_SUFFIX" ]]; then
            V18_VERSION="${V18_VERSION}.${V17_SUFFIX}"
          fi
          echo "V17_VERSION=$V17_VERSION" >> "$GITHUB_ENV"
          echo "V18_VERSION=$V18_VERSION" >> "$GITHUB_ENV"
          echo "Articulate v17 lane: $V17_VERSION"
          echo "Articulate v18 lane: $V18_VERSION"

      - name: Run build pipeline script
        shell: bash
        run: |
          set -euo pipefail

          ARTICULATE_PACKAGE_LANE=v17 \
          ARTICULATE_PACKAGE_VERSION="${V17_VERSION}" \
          PACK_SAMPLE_THEME=true \
          bash ./build/build.sh

          ARTICULATE_PACKAGE_LANE=v18 \
          ARTICULATE_PACKAGE_VERSION="${V18_VERSION}" \
          PACK_SAMPLE_THEME=true \
          bash ./build/build.sh

      - name: Upload v17 packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Articulate-${{ env.V17_VERSION }}
          path: |
            ${{ env.RELEASE_FOLDER }}/v17/*.nupkg
            ${{ env.RELEASE_FOLDER }}/v17/*.snupkg

      - name: Upload v18 packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Articulate-${{ env.V18_VERSION }}
          path: |
            ${{ env.RELEASE_FOLDER }}/v18/*.nupkg
            ${{ env.RELEASE_FOLDER }}/v18/*.snupkg
