packages:
  - "v17"
  - "v18"

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
allowBuilds:
  core-js: true
  esbuild: true
  unrs-resolver: true
blockExoticSubdeps: true
overrides:
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  dompurify@<3.4.16: ^3.4.16
  js-yaml@<4.3.2: ^4.3.2
  source-map-js@<1.2.2: ^1.2.2
minimumReleaseAgeExclude:
  - source-map-js@1.2.2
  - '@umbraco-cms/backoffice@17.7.1'
  - '@umbraco-cms/backoffice@18.2.1'
